{% extends 'base.html' %}
{% load i18n %}

{% block title %}課程退費 - Trytt System{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h2 class="mb-4">課程退費</h2>

            <!-- Member Search -->
            <div class="card mb-3" id="member-search-section">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-search"></i> 搜尋會員</h5>
                </div>
                <div class="card-body">
                    <div class="input-group">
                        <input type="text" id="member-search-input" class="form-control"
                               placeholder="輸入姓名或手機號碼">
                        <button class="btn btn-primary" onclick="searchMember()">
                            <i class="bi bi-search"></i> 搜尋
                        </button>
                    </div>
                    <div id="member-search-results" class="border rounded mt-2"
                         style="display:none; max-height:200px; overflow-y:auto;"></div>
                </div>
            </div>

            <!-- Member Info -->
            <div class="card mb-3" id="member-info-section" style="display:none;">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <strong id="member-name-display"></strong>
                        <span class="text-muted ms-2" id="member-phone-display"></span>
                    </div>
                    <button class="btn btn-outline-secondary btn-sm" onclick="resetSearch()">
                        重新搜尋
                    </button>
                </div>
            </div>

            <!-- Inventory List -->
            <div class="card mb-3" id="inventory-section" style="display:none;">
                <div class="card-header">
                    <h5 class="mb-0">選擇要退費的課程庫存</h5>
                </div>
                <div class="card-body p-0" id="inventory-list">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </div>
            </div>

            <!-- Refund Form -->
            <div class="card mb-3" id="refund-form-section" style="display:none;">
                <div class="card-header bg-warning-subtle">
                    <h5 class="mb-0"><i class="bi bi-arrow-return-left"></i> 退費確認</h5>
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-6">
                            <small class="text-muted">課程</small>
                            <div class="fw-bold" id="rf-course-name"></div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">原訂單</small>
                            <div id="rf-order-code"></div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <small class="text-muted">剩餘堂數</small>
                            <div><span id="rf-remaining"></span> 堂</div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">每堂單價</small>
                            <div>$<span id="rf-unit-price"></span></div>
                        </div>
                    </div>
                    <div class="row align-items-center mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold">退費堂數</label>
                            <input type="number" id="refund-qty-input" class="form-control"
                                   min="1" value="1" oninput="updateRefundPreview()">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">預計退費金額</label>
                            <div class="fs-4 text-danger fw-bold">-$<span id="refund-amount-preview">0</span></div>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-danger" onclick="submitRefund()">
                            <i class="bi bi-check-lg"></i> 確認退費
                        </button>
                        <button class="btn btn-outline-secondary" onclick="cancelRefundForm()">
                            取消
                        </button>
                    </div>
                </div>
            </div>

            <!-- Success -->
            <div class="card mb-3 border-success" id="success-section" style="display:none;">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0"><i class="bi bi-check-circle"></i> 退費成功</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-6">
                            <small class="text-muted">退費訂單編號</small>
                            <div class="fw-bold" id="success-refund-order-code"></div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">會員姓名</small>
                            <div id="success-member-name"></div>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-6">
                            <small class="text-muted">退費課程</small>
                            <div id="success-course-name"></div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">退費堂數</small>
                            <div><span id="success-refund-qty"></span> 堂</div>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-6">
                            <small class="text-muted">退費金額</small>
                            <div class="text-danger fw-bold fs-5">-$<span id="success-refund-amount"></span></div>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">退費後剩餘堂數</small>
                            <div><span id="success-remaining-qty"></span> 堂</div>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button class="btn btn-primary" onclick="resetAll()">繼續退費</button>
                        <a href="{% url 'core:order_list' %}" class="btn btn-outline-secondary">查看訂單記錄</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
let selectedMember = null;
let selectedInventory = null;

function searchMember() {
    const q = document.getElementById('member-search-input').value.trim();
    if (q.length < 2) { alert('請輸入至少2個字符'); return; }

    fetch(`/api/members/search/?q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(data => {
            if (!data.length) { alert('找不到符合的會員'); return; }
            if (data.length === 1) { selectMember(data[0]); return; }
            showMemberResults(data);
        })
        .catch(() => alert('搜尋失敗，請稍後再試'));
}

function showMemberResults(members) {
    const el = document.getElementById('member-search-results');
    el.innerHTML = '';
    members.forEach(m => {
        const div = document.createElement('div');
        div.className = 'p-2 border-bottom cursor-pointer';
        div.style.cursor = 'pointer';
        div.innerHTML = `<strong>${m.name}</strong> <span class="text-muted">${m.phone}</span>`;
        div.onclick = () => selectMember(m);
        el.appendChild(div);
    });
    el.style.display = 'block';
}

function selectMember(m) {
    selectedMember = m;
    document.getElementById('member-search-results').style.display = 'none';
    document.getElementById('member-name-display').textContent = m.name;
    document.getElementById('member-phone-display').textContent = m.phone;
    document.getElementById('member-info-section').style.display = 'block';
    document.getElementById('refund-form-section').style.display = 'none';
    loadInventory(m.id);
}

function loadInventory(memberId) {
    document.getElementById('inventory-section').style.display = 'block';
    document.getElementById('inventory-list').innerHTML =
        '<div class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></div>';

    fetch(`/api/members/${memberId}/inventory/`)
        .then(r => r.json())
        .then(data => renderInventory(data))
        .catch(() => {
            document.getElementById('inventory-list').innerHTML =
                '<div class="alert alert-danger m-3">載入失敗，請稍後再試</div>';
        });
}

function renderInventory(inventories) {
    const el = document.getElementById('inventory-list');
    if (!inventories.length) {
        el.innerHTML = '<div class="text-center py-4 text-muted">此會員目前沒有可退費的課程庫存</div>';
        return;
    }
    el.innerHTML = '';
    const table = document.createElement('table');
    table.className = 'table table-hover mb-0';
    table.innerHTML = `
        <thead class="table-light">
            <tr>
                <th>課程名稱</th>
                <th class="text-center">訂單編號</th>
                <th class="text-center">訂單日期</th>
                <th class="text-center">剩餘堂數</th>
                <th class="text-center">每堂單價</th>
                <th class="text-center">操作</th>
            </tr>
        </thead>
        <tbody id="inventory-tbody"></tbody>`;
    el.appendChild(table);

    const tbody = document.getElementById('inventory-tbody');
    inventories.forEach(inv => {
        const tr = document.createElement('tr');
        const priceDisplay = inv.unit_price != null ? `$${inv.unit_price.toFixed(0)}` : '—';
        tr.innerHTML = `
            <td><strong>${inv.course_name}</strong><br><small class="text-muted">${inv.course_code}</small></td>
            <td class="text-center">${inv.order_code}</td>
            <td class="text-center">${inv.order_date}</td>
            <td class="text-center">${inv.remaining_quantity}</td>
            <td class="text-center">${priceDisplay}</td>
            <td class="text-center">
                <button class="btn btn-warning btn-sm"
                        onclick='selectInventory(${JSON.stringify(inv)})'>
                    選擇退費
                </button>
            </td>`;
        tbody.appendChild(tr);
    });
}

function selectInventory(inv) {
    selectedInventory = inv;
    document.getElementById('rf-course-name').textContent = inv.course_name;
    document.getElementById('rf-order-code').textContent = inv.order_code;
    document.getElementById('rf-remaining').textContent = inv.remaining_quantity;
    document.getElementById('rf-unit-price').textContent =
        inv.unit_price != null ? inv.unit_price.toFixed(0) : '未知';
    document.getElementById('refund-qty-input').max = inv.remaining_quantity;
    document.getElementById('refund-qty-input').value = 1;
    updateRefundPreview();
    document.getElementById('refund-form-section').style.display = 'block';
    document.getElementById('refund-form-section').scrollIntoView({ behavior: 'smooth' });
}

function updateRefundPreview() {
    const qty = parseInt(document.getElementById('refund-qty-input').value) || 0;
    const unitPrice = selectedInventory && selectedInventory.unit_price != null
        ? selectedInventory.unit_price : 0;
    document.getElementById('refund-amount-preview').textContent =
        (qty * unitPrice).toFixed(0);
}

function cancelRefundForm() {
    document.getElementById('refund-form-section').style.display = 'none';
    selectedInventory = null;
}

function submitRefund() {
    if (!selectedMember || !selectedInventory) return;

    const qty = parseInt(document.getElementById('refund-qty-input').value);
    if (!qty || qty <= 0) { alert('請輸入有效的退費堂數'); return; }
    if (qty > selectedInventory.remaining_quantity) {
        alert(`退費數量不能超過剩餘堂數（${selectedInventory.remaining_quantity}堂）`);
        return;
    }

    if (!confirm(`確定退費 ${qty} 堂「${selectedInventory.course_name}」？此操作無法復原。`)) return;

    const formData = new FormData();
    formData.append('member_id', selectedMember.id);
    formData.append('course_inventory_id', selectedInventory.id);
    formData.append('refund_qty', qty);

    fetch('/api/courses/refund/', {
        method: 'POST',
        body: formData,
        headers: { 'X-CSRFToken': getCookie('csrftoken') }
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            showSuccess(data);
        } else {
            alert(data.error || '退費失敗，請稍後再試');
        }
    })
    .catch(() => alert('退費失敗，請稍後再試'));
}

function showSuccess(data) {
    document.getElementById('inventory-section').style.display = 'none';
    document.getElementById('refund-form-section').style.display = 'none';
    document.getElementById('success-refund-order-code').textContent = data.refund_order_code;
    document.getElementById('success-member-name').textContent = data.member_name;
    document.getElementById('success-course-name').textContent = data.course_name;
    document.getElementById('success-refund-qty').textContent = data.refund_qty;
    document.getElementById('success-refund-amount').textContent =
        parseFloat(data.refund_amount).toFixed(0);
    document.getElementById('success-remaining-qty').textContent = data.remaining_qty;
    document.getElementById('success-section').style.display = 'block';
    document.getElementById('success-section').scrollIntoView({ behavior: 'smooth' });
}

function resetSearch() {
    selectedMember = null;
    selectedInventory = null;
    document.getElementById('member-search-input').value = '';
    document.getElementById('member-info-section').style.display = 'none';
    document.getElementById('inventory-section').style.display = 'none';
    document.getElementById('refund-form-section').style.display = 'none';
}

function resetAll() {
    resetSearch();
    document.getElementById('success-section').style.display = 'none';
}

document.getElementById('member-search-input').addEventListener('keypress', e => {
    if (e.key === 'Enter') searchMember();
});

function getCookie(name) {
    let val = null;
    if (document.cookie) {
        document.cookie.split(';').forEach(c => {
            c = c.trim();
            if (c.startsWith(name + '=')) val = decodeURIComponent(c.slice(name.length + 1));
        });
    }
    return val;
}
</script>
{% endblock %}
